# Mantiene despierto el servicio gratis de Render (se duerme a los 15 minutos sin uso).
# Pide /salud cada 5 minutos (GitHub a veces atrasa o saltea corridas programadas;
# el propio servidor también se autopinguea, ver AUTOPING_URL en servidor.mjs). Para activarlo:
#   GitHub > Settings > Secrets and variables > Actions > Variables > New repository variable
#   Nombre: GRIDIE_URL   Valor: https://gridie-blocks.onrender.com  (tu dirección de Render)
name: Mantener despierto Render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.GRIDIE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pedir /salud
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.GRIDIE_URL }}/salud"
